name: Shared-host env fallback

on:
  push:
  pull_request:

jobs:
  env-without-process-functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Load .env with getenv and putenv disabled
        run: php -d disable_functions=getenv,putenv tests/config_env_fallback.php
