name: PATCH 026 panel table hotfix

on:
  push:
    branches:
      - agent/patch-026-central-web-security-docs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply panel table-name hotfix
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('public/staffAdmin.php'): (
                  "$loginTable = $tables->get('core_staff_admin_login_attempts');",
                  "$loginTable = $tables->raw('core_staff_admin_login_attempts');",
              ),
              Path('public/eventAdmin.php'): (
                  "$tables->get('core_staff_admin_login_attempts'),",
                  "$tables->raw('core_staff_admin_login_attempts'),",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'Expected table-name expression not found in {path}')
              if old in text:
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding='utf-8')

          test_path = Path('tests/web_security.php')
          test = test_path.read_text(encoding='utf-8')
          marker = "        $assert(is_string($source) && !str_contains($source, 'onclick='), $panelFile . ' has no inline click handler');\n"
          addition = marker + "        if (in_array($panelFile, ['staffAdmin.php', 'eventAdmin.php'], true)) {\n            $assert(\n                is_string($source) && str_contains($source, \"->raw('core_staff_admin_login_attempts')\"),\n                $panelFile . ' passes an unquoted validated table name to PanelLoginThrottle'\n            );\n        }\n"
          if "passes an unquoted validated table name to PanelLoginThrottle" not in test:
              if marker not in test:
                  raise SystemExit('Web security test insertion marker not found')
              test = test.replace(marker, addition, 1)
              test_path.write_text(test, encoding='utf-8')

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          php -l public/staffAdmin.php
          php -l public/eventAdmin.php
          php -l tests/web_security.php
          php tests/web_security.php
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git add public/staffAdmin.php public/eventAdmin.php tests/web_security.php
          if git diff --cached --quiet; then
            echo 'Hotfix already applied.'
            exit 0
          fi
          git config user.name 'Night Core automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix panel login throttle table names'
          git push origin "HEAD:${GITHUB_REF_NAME}"
