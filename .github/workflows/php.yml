name: PHP checks

on:
  push:
  pull_request:

jobs:
  lint-and-self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
      - name: PHP syntax
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/nightcore
          php -l bin/nightcore-smoke
      - name: Core self-test
        run: php bin/nightcore self-test
      - name: CLI help without database
        run: php bin/nightcore help

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nightcore_test
          MARIADB_USER: nightcore
          MARIADB_PASSWORD: nightcore
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: production
      APP_DEBUG: 0
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nightcore_test
      DB_USER: nightcore
      DB_PASS: nightcore
      DB_CHARSET: utf8mb4
      CORE_TABLE_PREFIX: it_
      ACCOUNT_PREACTIVATE: 1
      LEVEL_STORAGE_PATH: /tmp/nightcore-levels
      LEVEL_UPLOAD_COOLDOWN_SECONDS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: MariaDB integration
        run: php tests/integration.php
      - name: Production installer and doctor
        run: |
          cp .env.example .env
          php bin/nightcore install
          php bin/nightcore doctor
      - name: Staging operational smoke
        run: |
          php -S 127.0.0.1:8099 -t public >/tmp/nightcore-staging-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          php bin/nightcore-smoke http://127.0.0.1:8099 || {
            echo '--- staging smoke HTTP server log ---'
            cat /tmp/nightcore-staging-smoke.log 2>/dev/null || true
            exit 1
          }

  staging-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Prepare staging environment
        run: cp .env.staging.example .env
      - name: Validate compose configuration
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml config >/tmp/nightcore-staging-compose.yml
      - name: Build staging image
        run: docker compose -f compose.staging.yml build --pull web
      - name: Start staging database
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml up -d db
      - name: Install Night Core in staging stack
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml run --rm web php bin/nightcore install
      - name: Start staging web
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml up -d web
      - name: Smoke staging stack
        run: |
          sleep 2
          php bin/nightcore-smoke http://127.0.0.1:18080 || {
            echo '--- staging compose status ---'
            STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml ps || true
            echo '--- staging web log ---'
            STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml logs web || true
            echo '--- staging db log ---'
            STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml logs db || true
            exit 1
          }
      - name: Tear down staging stack
        if: always()
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml down -v

  shared-hosting-apache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: shared_test
          MARIADB_USER: shared_user
          MARIADB_PASSWORD: shared_password
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Build shared-hosting Apache test image
        run: |
          cat > /tmp/nightcore-shared.Dockerfile <<'EOF'
          FROM php:8.3-apache
          RUN docker-php-ext-install pdo_mysql \
              && a2enmod rewrite \
              && sed -ri 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf
          WORKDIR /var/www/html
          COPY . /var/www/html
          RUN chown -R www-data:www-data /var/www/html/data
          EOF
          docker build -f /tmp/nightcore-shared.Dockerfile -t nightcore-shared-test .
      - name: Start shared-hosting layout
        run: |
          docker run -d --name nightcore-shared --network host \
            -e APP_ENV=staging \
            -e APP_DEBUG=0 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_NAME=shared_test \
            -e DB_USER=shared_user \
            -e DB_PASS=shared_password \
            -e DB_CHARSET=utf8mb4 \
            -e LEVEL_STORAGE_PATH= \
            -e WEB_INSTALL_TOKEN=shared-ci-token \
            nightcore-shared-test
          sleep 2
      - name: Run token-gated browser installer
        run: |
          curl --fail --silent --show-error \
            --data-urlencode 'token=shared-ci-token' \
            http://127.0.0.1/install.php | tee /tmp/nightcore-install.txt
          grep -q 'Installation checks: OK' /tmp/nightcore-install.txt
      - name: Verify public endpoints and private-root guard
        run: |
          php bin/nightcore-smoke http://127.0.0.1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/bootstrap.php)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/src/Core/Application.php)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/migrations/0001_core.sql)" = "404"
      - name: Shared-hosting logs
        if: failure()
        run: docker logs nightcore-shared || true
      - name: Tear down shared-hosting test
        if: always()
        run: docker rm -f nightcore-shared 2>/dev/null || true
