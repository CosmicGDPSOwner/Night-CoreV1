name: PHP checks

on:
  push:
  pull_request:

jobs:
  lint-and-self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
      - name: PHP syntax
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/nightcore
          php -l bin/nightcore-smoke
      - name: Core self-test
        run: php bin/nightcore self-test
      - name: CLI help without database
        run: php bin/nightcore help

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nightcore_test
          MARIADB_USER: nightcore
          MARIADB_PASSWORD: nightcore
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: production
      APP_DEBUG: 0
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nightcore_test
      DB_USER: nightcore
      DB_PASS: nightcore
      DB_CHARSET: utf8mb4
      CORE_TABLE_PREFIX: it_
      ACCOUNT_PREACTIVATE: 1
      LEVEL_STORAGE_PATH: /tmp/nightcore-levels
      LEVEL_UPLOAD_COOLDOWN_SECONDS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: MariaDB integration
        run: php tests/integration.php
      - name: Production installer and doctor
        run: |
          cp .env.example .env
          php bin/nightcore install
          php bin/nightcore doctor
      - name: Staging operational smoke
        run: |
          php -S 127.0.0.1:8099 -t public >/tmp/nightcore-staging-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          php bin/nightcore-smoke http://127.0.0.1:8099 || {
            echo '--- staging smoke HTTP server log ---'
            cat /tmp/nightcore-staging-smoke.log 2>/dev/null || true
            exit 1
          }

  staging-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Prepare staging environment
        run: cp .env.staging.example .env
      - name: Validate compose configuration
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml config >/tmp/nightcore-staging-compose.yml
      - name: Build staging image
        run: docker compose -f compose.staging.yml build --pull web
      - name: Start staging database
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml up -d db
      - name: Install Night Core in staging stack
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml run --rm web php bin/nightcore install
      - name: Start staging web
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml up -d web
      - name: Smoke staging stack
        run: |
          sleep 2
          php bin/nightcore-smoke http://127.0.0.1:18080 || {
            echo '--- staging compose status ---'
            STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml ps || true
            echo '--- staging web log ---'
            STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml logs web || true
            echo '--- staging db log ---'
            STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml logs db || true
            exit 1
          }
      - name: Tear down staging stack
        if: always()
        run: STAGING_HTTP_PORT=18080 docker compose -f compose.staging.yml down -v
