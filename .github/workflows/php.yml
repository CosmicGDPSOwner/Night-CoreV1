name: PHP checks

on:
  push:
  pull_request:

jobs:
  lint-and-self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Core self-test
        run: php bin/nightcore self-test
      - name: CLI help without database
        run: php bin/nightcore help

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nightcore_test
          MARIADB_USER: nightcore
          MARIADB_PASSWORD: nightcore
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: production
      APP_DEBUG: 0
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nightcore_test
      DB_USER: nightcore
      DB_PASS: nightcore
      DB_CHARSET: utf8mb4
      CORE_TABLE_PREFIX: it_
      ACCOUNT_PREACTIVATE: 1
      LEVEL_STORAGE_PATH: /tmp/nightcore-levels
      LEVEL_UPLOAD_COOLDOWN_SECONDS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: MariaDB integration
        run: php tests/integration.php
      - name: Production installer and doctor
        run: |
          cp .env.example .env
          php bin/nightcore install
          php bin/nightcore doctor
