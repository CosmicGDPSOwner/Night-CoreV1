services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - nightcore_staging_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nightcore_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      LEVEL_STORAGE_PATH: /var/lib/nightcore/levels
    volumes:
      - ./.env:/var/www/html/.env:ro
      - nightcore_staging_levels:/var/lib/nightcore/levels
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nightcore_internal

volumes:
  nightcore_staging_db:
  nightcore_staging_levels:

networks:
  nightcore_internal:
    driver: bridge
